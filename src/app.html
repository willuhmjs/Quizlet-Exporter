<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<meta
			name="description"
			content="Save any Quizlet study set as a Word document. Upload the saved HTML page and download a clean DOCX table of terms and definitions."
		/>
		<title>Quizlet to DOCX</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<style>
			:root {
				color-scheme: dark;
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family:
					'Inter',
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				font-feature-settings:
					'cv01',
					'ss03';
			}

			body {
				background-color: #08090a;
				background-image: radial-gradient(
						ellipse 80% 50% at 50% -10%,
						rgba(94, 106, 210, 0.18),
						transparent 70%
					),
					radial-gradient(
						ellipse 40% 35% at 85% 110%,
						rgba(113, 112, 255, 0.07),
						transparent 70%
					);
				background-attachment: fixed;
				color: #f7f8f8;
				-webkit-font-smoothing: antialiased;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
